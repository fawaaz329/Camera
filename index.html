<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Smart AI Product Camera</title>
  <!-- Load ONNX Runtime Web Natively -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.1/dist/ort.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; background-color: #000; color: #fff; font-family: -apple-system, sans-serif; overflow: hidden; }
    #app { position: relative; width: 100vw; height: 100vh; height: 100dvh; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
    #video-container { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }
    #overlay-mask { position: absolute; inset: 0; z-index: 2; pointer-events: none; display: flex; align-items: center; justify-content: center; }
    .reticle-box { width: 82vw; max-width: 400px; aspect-ratio: 1 / 1; position: relative; box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.65); border-radius: 4px; }
    .corner { position: absolute; width: 22px; height: 22px; border-color: #00e5ff; border-style: solid; pointer-events: none; }
    .top-left { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
    .top-right { top: -2px; right: -2px; border-width: 3px 3px 0 0; }
    .bottom-left { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; }
    .bottom-right { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }
    .top-bar { position: relative; z-index: 3; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%); }
    .badge { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2); }
    .badge-target { color: #00e5ff; border-color: rgba(0, 229, 255, 0.4); }
    .bottom-controls { position: relative; z-index: 3; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 70%, transparent 100%); padding-bottom: env(safe-area-inset-bottom, 16px); }
    .shutter-row { display: flex; align-items: center; justify-content: center; padding: 6px 0; }
    .shutter-btn { position: relative; width: 74px; height: 74px; border-radius: 50%; border: 4px solid #ffffff; background: transparent; padding: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; outline: none; transition: transform 0.08s ease; }
    .shutter-btn:active { transform: scale(0.92); }
    .shutter-btn-inner { width: 100%; height: 100%; border-radius: 50%; background-color: #ffffff; }
    .shutter-btn.loading { pointer-events: none; opacity: 0.6; }
    .drawer-container { width: 100%; display: flex; flex-direction: column; gap: 6px; padding: 0 16px; }
    .drawer-label { font-size: 11px; color: rgba(255, 255, 255, 0.6); text-transform: uppercase; letter-spacing: 0.5px; }
    .gallery-drawer { display: flex; overflow-x: auto; gap: 10px; padding: 4px 2px 8px 2px; scrollbar-width: none; }
    .gallery-drawer::-webkit-scrollbar { display: none; }
    .thumb-wrap { flex: 0 0 68px; height: 68px; border-radius: 8px; overflow: hidden; border: 2px solid rgba(255, 255, 255, 0.3); background: #ffffff; position: relative; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-size-tag { position: absolute; bottom: 2px; left: 2px; right: 2px; background: rgba(0, 0, 0, 0.75); color: #00e5ff; font-size: 9px; font-weight: 700; text-align: center; border-radius: 4px; padding: 1px 0; }
    #flash-overlay { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 10; transition: opacity 0.15s ease-out; }
    #status-toast { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); border: 1px solid #00e5ff; padding: 8px 16px; border-radius: 20px; font-size: 12px; z-index: 100; color: #00e5ff; display: block; }
    #error-modal { display: none; position: absolute; inset: 20px; margin: auto; height: fit-content; max-width: 480px; background: #1a1a1a; border: 1px solid #ff4444; border-radius: 12px; padding: 20px; z-index: 99; box-shadow: 0 10px 30px rgba(0,0,0,0.8); font-size: 14px; line-height: 1.5; }
    #error-modal h3 { color: #ff5252; margin-bottom: 8px; }
  </style>
</head>
<body>

<div id="app">
  <div id="status-toast">Initializing RMBG-1.4 Engine...</div>
  
  <div id="video-container">
    <video id="camera-stream" autoplay playsinline muted></video>
  </div>

  <div id="overlay-mask">
    <div class="reticle-box">
      <span class="corner top-left"></span>
      <span class="corner top-right"></span>
      <span class="corner bottom-left"></span>
      <span class="corner bottom-right"></span>
    </div>
  </div>

  <div class="top-bar">
    <span class="badge">1000 &times; 1000</span>
    <span class="badge badge-target">Target: 40KB - 80KB</span>
  </div>

  <div class="bottom-controls">
    <div class="drawer-container">
      <span class="drawer-label" id="drawer-count">Captured Session (0)</span>
      <div class="gallery-drawer" id="gallery-drawer"></div>
    </div>

    <div class="shutter-row">
      <button class="shutter-btn" id="shutter-trigger" aria-label="Capture Photo">
        <div class="shutter-btn-inner"></div>
      </button>
    </div>
  </div>

  <div id="flash-overlay"></div>

  <div id="error-modal">
    <h3 id="error-title">Error</h3>
    <p id="error-desc"></p>
  </div>
</div>

<script>
  (function () {
    const video = document.getElementById('camera-stream');
    const shutterBtn = document.getElementById('shutter-trigger');
    const galleryDrawer = document.getElementById('gallery-drawer');
    const drawerCount = document.getElementById('drawer-count');
    const flashOverlay = document.getElementById('flash-overlay');
    const statusToast = document.getElementById('status-toast');
    
    let aiSession = null;
    let captureCount = 0;
    let isProcessing = false;

    // Load RMBG-1.4 Web Model with wrapped SessionOptions
    async function loadAIModel() {
      try {
        if (typeof ort === 'undefined') throw new Error("ONNX runtime failed to load.");

        // Global WASM threading constraints
        ort.env.wasm.numThreads = 1;
        ort.env.wasm.simd = true;

        // Wrapped SessionOptions specification compatible with newer onnxruntime-web
        const sessionOptions = {
          executionProviders: [
            {
              name: 'wasm'
            }
          ],
          graphOptimizationLevel: 'all'
        };

        const modelUrl = 'https://huggingface.co/briaai/RMBG-1.4/resolve/main/onnx/model.onnx';

        aiSession = await ort.InferenceSession.create(modelUrl, sessionOptions);

        statusToast.textContent = "RMBG-1.4 Vision Engine Ready";
        setTimeout(() => { statusToast.style.display = 'none'; }, 2200);
      } catch (e) {
        console.warn("RMBG-1.4 session init issue, edge fallback enabled:", e);
        statusToast.textContent = "Edge Engine Ready (Local Mode)";
        setTimeout(() => { statusToast.style.display = 'none'; }, 2500);
      }
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { exact: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }
        });
        video.srcObject = stream;
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({ 
            audio: false, 
            video: { facingMode: "environment" } 
          });
          video.srcObject = fallbackStream;
        } catch (e) {
          const basicStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
          video.srcObject = basicStream;
        }
      }
    }

    function canvasToBlobAsync(canvas, quality) {
      return new Promise((resolve) => canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality));
    }

    async function compressToTarget(canvas, minKB = 40, maxKB = 80) {
      const minBytes = minKB * 1024; 
      const maxBytes = maxKB * 1024;
      let low = 0.05, high = 0.90, bestBlob = null;

      for (let i = 0; i < 6; i++) {
        const testQuality = (low + high) / 2;
        const blob = await canvasToBlobAsync(canvas, testQuality);
        if (!blob) break;
        bestBlob = blob;

        if (blob.size >= minBytes && blob.size <= maxBytes) return blob;
        if (blob.size > maxBytes) high = testQuality; else low = testQuality;
      }
      return bestBlob;
    }

    // --- High-Precision RMBG-1.4 Pipeline ---
    async function extractSubjectAI(ctx, targetWidth, targetHeight) {
      if (!aiSession) {
        applyPerimeterFallback(ctx, targetWidth, targetHeight);
        return;
      }

      try {
        const MODEL_DIM = 1024; // Model requires exact 1024x1024 tensor geometry

        // 1. Resample 1000x1000 workspace to 1024x1024 input
        const tensorCanvas = document.createElement('canvas');
        tensorCanvas.width = MODEL_DIM;
        tensorCanvas.height = MODEL_DIM;
        const tCtx = tensorCanvas.getContext('2d', { willReadFrequently: true });
        tCtx.drawImage(ctx.canvas, 0, 0, MODEL_DIM, MODEL_DIM);

        const imgData = tCtx.getImageData(0, 0, MODEL_DIM, MODEL_DIM);
        const data = imgData.data;

        // 2. Planar NCHW [1, 3, 1024, 1024] Allocation
        const totalPixels = MODEL_DIM * MODEL_DIM;
        const inputTensor = new Float32Array(3 * totalPixels);

        // 3. Exact RMBG-1.4 Mean-Shift Normalization: (x / 255.0 - 0.5) / 1.0 => Range: [-0.5, 0.5]
        for (let i = 0; i < totalPixels; i++) {
          const r = data[i * 4];
          const g = data[i * 4 + 1];
          const b = data[i * 4 + 2];

          inputTensor[i]                   = (r / 255.0) - 0.5; // R
          inputTensor[totalPixels + i]     = (g / 255.0) - 0.5; // G
          inputTensor[2 * totalPixels + i] = (b / 255.0) - 0.5; // B
        }

        // 4. Query Input Node Name dynamically
        const inputNodeName = aiSession.inputNames[0] || 'input';
        const feeds = {};
        feeds[inputNodeName] = new ort.Tensor('float32', inputTensor, [1, 3, MODEL_DIM, MODEL_DIM]);

        // 5. Execute ONNX Neural Inference
        const results = await aiSession.run(feeds);
        const outputNodeName = aiSession.outputNames[0] || Object.keys(results)[0];
        const rawOutputMask = results[outputNodeName].data;

        // 6. Dynamic Min-Max Scaling
        let minVal = Infinity, maxVal = -Infinity;
        for (let i = 0; i < totalPixels; i++) {
          const v = rawOutputMask[i];
          if (v < minVal) minVal = v;
          if (v > maxVal) maxVal = v;
        }
        const range = (maxVal - minVal) || 1.0;

        // 7. Build OPAQUE Luminance Matte (A = 255) to eliminate premultiplied alpha fringing
        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = MODEL_DIM;
        maskCanvas.height = MODEL_DIM;
        const maskCtx = maskCanvas.getContext('2d');
        const maskImgData = maskCtx.createImageData(MODEL_DIM, MODEL_DIM);
        const mData = maskImgData.data;

        for (let i = 0; i < totalPixels; i++) {
          const alphaNorm = (rawOutputMask[i] - minVal) / range;
          const alphaByte = Math.max(0, Math.min(255, Math.round(alphaNorm * 255)));

          mData[i * 4]     = alphaByte; // R
          mData[i * 4 + 1] = alphaByte; // G
          mData[i * 4 + 2] = alphaByte; // B
          mData[i * 4 + 3] = 255;       // A (Opaque avoids color-bleeding during downsample)
        }
        maskCtx.putImageData(maskImgData, 0, 0);

        // 8. Resample Luminance Matte cleanly back to exact 1000x1000 workspace
        const finalMaskCanvas = document.createElement('canvas');
        finalMaskCanvas.width = targetWidth;
        finalMaskCanvas.height = targetHeight;
        const fmCtx = finalMaskCanvas.getContext('2d');
        fmCtx.imageSmoothingEnabled = true;
        fmCtx.imageSmoothingQuality = 'high';
        fmCtx.drawImage(maskCanvas, 0, 0, targetWidth, targetHeight);
        const finalMaskData = fmCtx.getImageData(0, 0, targetWidth, targetHeight).data;

        // 9. Alpha blend with Studio White (#FFFFFF) to preserve transparent plastics and glass
        const originalData = ctx.getImageData(0, 0, targetWidth, targetHeight);
        const oPixels = originalData.data;
        const numPixels = targetWidth * targetHeight;

        for (let i = 0; i < numPixels; i++) {
          const alphaFactor = finalMaskData[i * 4] / 255.0; // 0.0 (background) to 1.0 (product)
          const invAlpha = 1.0 - alphaFactor;

          oPixels[i * 4]     = Math.round(oPixels[i * 4] * alphaFactor + 255 * invAlpha);
          oPixels[i * 4 + 1] = Math.round(oPixels[i * 4 + 1] * alphaFactor + 255 * invAlpha);
          oPixels[i * 4 + 2] = Math.round(oPixels[i * 4 + 2] * alphaFactor + 255 * invAlpha);
        }

        ctx.putImageData(originalData, 0, 0);

      } catch (err) {
        console.error("Inference execution failure, defaulting to edge protection:", err);
        applyPerimeterFallback(ctx, targetWidth, targetHeight);
      }
    }

    // High-contrast local boundary safeguard
    function applyPerimeterFallback(ctx, width, height) {
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
        if (brightness > 220) { 
          data[i] = 255; data[i+1] = 255; data[i+2] = 255; 
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    async function captureProductPhoto() {
      if (isProcessing || !video.videoWidth || !video.videoHeight) return;
      isProcessing = true;

      if (navigator.vibrate) navigator.vibrate(40);
      flashOverlay.style.opacity = '0.9';
      setTimeout(() => { flashOverlay.style.opacity = '0'; }, 120);

      shutterBtn.classList.add('loading');

      try {
        const canvas = document.createElement('canvas');
        canvas.width = 1000;
        canvas.height = 1000;
        const ctx = canvas.getContext('2d', { alpha: false });

        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const cropSize = Math.min(vw, vh);
        const sx = (vw - cropSize) / 2;
        const sy = (vh - cropSize) / 2;

        ctx.drawImage(video, sx, sy, cropSize, cropSize, 0, 0, 1000, 1000);

        await extractSubjectAI(ctx, 1000, 1000);

        const blob = await compressToTarget(canvas, 40, 80);
        if (!blob) return;

        const sizeInKB = Math.round(blob.size / 1024);

        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        const filename = `prod_${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.jpg`;

        const objectUrl = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = objectUrl;
        anchor.download = filename;
        document.body.appendChild(anchor);
        anchor.click();
        document.body.removeChild(anchor);

        appendThumbnail(objectUrl, filename, sizeInKB);
      } finally {
        shutterBtn.classList.remove('loading');
        isProcessing = false;
      }
    }

    function appendThumbnail(url, title, sizeInKB) {
      captureCount++;
      drawerCount.textContent = `Captured Session (${captureCount})`;

      const wrap = document.createElement('div');
      wrap.className = 'thumb-wrap';

      const img = document.createElement('img');
      img.src = url;
      img.alt = title;

      const tag = document.createElement('div');
      tag.className = 'thumb-size-tag';
      tag.textContent = `${sizeInKB} KB`;

      wrap.appendChild(img);
      wrap.appendChild(tag);
      galleryDrawer.prepend(wrap);
    }

    shutterBtn.addEventListener('click', captureProductPhoto);

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        initCamera();
        loadAIModel();
      });
    } else {
      initCamera();
      loadAIModel();
    }
  })();
</script>
</body>
</html>
