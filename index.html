<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>E-Commerce Product Camera</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Video Feed */
    #video-container {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Square Frame Overlay System */
    #overlay-mask {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reticle-box {
      width: 82vw;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      position: relative;
      /* Dim outside bounds using an expansive box shadow */
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.65);
      border-radius: 4px;
    }

    /* Corner Accent Guides */
    .corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: #00e5ff;
      border-style: solid;
      pointer-events: none;
    }
    .top-left { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
    .top-right { top: -2px; right: -2px; border-width: 3px 3px 0 0; }
    .bottom-left { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; }
    .bottom-right { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }

    /* Top Bar */
    .top-bar {
      position: relative;
      z-index: 3;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Controls & Bottom UI */
    .bottom-controls {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }

    .shutter-row {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 0;
    }

    .shutter-btn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      background: transparent;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.08s ease;
    }

    .shutter-btn:active {
      transform: scale(0.92);
    }

    .shutter-btn-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: #ffffff;
    }

    /* Gallery Preview Drawer */
    .drawer-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 16px;
    }

    .drawer-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .gallery-drawer {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      padding: 6px 2px 10px 2px;
      scrollbar-width: none; /* Firefox */
    }
    .gallery-drawer::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }

    .thumb-wrap {
      flex: 0 0 62px;
      height: 62px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: #111;
      position: relative;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Flash UI Animation */
    #flash-overlay {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.15s ease-out;
    }

    /* Context Error Banner (Local file protocol / Insecure) */
    #error-modal {
      display: none;
      position: absolute;
      inset: 20px;
      margin: auto;
      height: fit-content;
      max-width: 480px;
      background: #1a1a1a;
      border: 1px solid #ff4444;
      border-radius: 12px;
      padding: 20px;
      z-index: 99;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      font-size: 14px;
      line-height: 1.5;
    }
    #error-modal h3 {
      color: #ff5252;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

<div id="app">
  <!-- Camera Feed -->
  <div id="video-container">
    <video id="camera-stream" autoplay playsinline muted></video>
  </div>

  <!-- Square Viewfinder Overlay -->
  <div id="overlay-mask">
    <div class="reticle-box">
      <span class="corner top-left"></span>
      <span class="corner top-right"></span>
      <span class="corner bottom-left"></span>
      <span class="corner bottom-right"></span>
    </div>
  </div>

  <!-- Header Info -->
  <div class="top-bar">
    <span class="badge">1:1 Square</span>
    <span class="badge" id="res-badge">1000 &times; 1000</span>
  </div>

  <!-- Bottom Interaction Panel -->
  <div class="bottom-controls">
    <!-- Horizontal Gallery Drawer -->
    <div class="drawer-container">
      <span class="drawer-label" id="drawer-count">Captured Session (0)</span>
      <div class="gallery-drawer" id="gallery-drawer"></div>
    </div>

    <!-- Shutter Button -->
    <div class="shutter-row">
      <button class="shutter-btn" id="shutter-trigger" aria-label="Capture Photo">
        <div class="shutter-btn-inner"></div>
      </button>
    </div>
  </div>

  <!-- Flash Screen Feedback -->
  <div id="flash-overlay"></div>

  <!-- Context / Permission Notice -->
  <div id="error-modal">
    <h3 id="error-title">Camera Security Error</h3>
    <p id="error-desc"></p>
  </div>
</div>

<script>
  (function () {
    const video = document.getElementById('camera-stream');
    const shutterBtn = document.getElementById('shutter-trigger');
    const galleryDrawer = document.getElementById('gallery-drawer');
    const drawerCount = document.getElementById('drawer-count');
    const flashOverlay = document.getElementById('flash-overlay');
    const errorModal = document.getElementById('error-modal');
    const errorTitle = document.getElementById('error-title');
    const errorDesc = document.getElementById('error-desc');

    let captureCount = 0;

    // Verify context (Android Chrome blocks camera on file:// or non-localhost HTTP)
    function checkSecurityContext() {
      if (window.location.protocol === 'file:') {
        showError(
          'Local File Protocol Blocked',
          'Android Chrome disables camera access when opening files directly via <b>file:///</b>. Run a local web server (e.g. <code>python3 -m http.server 8080</code> or GitHub Pages) and open via <b>http://localhost</b> or <b>HTTPS</b>.'
        );
        return false;
      }
      if (!window.isSecureContext) {
        showError(
          'Insecure Context',
          'Camera APIs require a secure origin (HTTPS or localhost). Please switch to an encrypted connection.'
        );
        return false;
      }
      return true;
    }

    function showError(title, message) {
      errorTitle.innerHTML = title;
      errorDesc.innerHTML = message;
      errorModal.style.display = 'block';
    }

    // Initialize Camera targeting rear sensor
    async function initCamera() {
      if (!checkSecurityContext()) return;

      const constraints = {
        audio: false,
        video: {
          facingMode: { exact: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      };

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
      } catch (err) {
        console.warn("Exact environment camera query failed, trying standard fallback...", err);
        // Fallback in case device doesn't support 'exact' constraint
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { facingMode: "environment" }
          });
          video.srcObject = fallbackStream;
        } catch (fallbackErr) {
          showError(
            'Camera Access Denied',
            'Could not access the rear camera. Ensure camera permissions are granted in Chrome settings. Details: ' + fallbackErr.message
          );
        }
      }
    }

    // Capture, Center-Crop to 1000x1000, and Process
    function captureProductPhoto() {
      if (!video.videoWidth || !video.videoHeight) return;

      // Haptic confirmation
      if (navigator.vibrate) navigator.vibrate(40);

      // Flash feedback
      flashOverlay.style.opacity = '0.9';
      setTimeout(() => { flashOverlay.style.opacity = '0'; }, 120);

      // 1. Setup off-screen canvas locked at 1000x1000
      const canvas = document.createElement('canvas');
      canvas.width = 1000;
      canvas.height = 1000;
      const ctx = canvas.getContext('2d', { alpha: false });

      // 2. Compute 1:1 Center Crop coordinates from video resolution
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const cropSize = Math.min(vw, vh);
      const sx = (vw - cropSize) / 2;
      const sy = (vh - cropSize) / 2;

      // 3. Render cropped region
      ctx.drawImage(video, sx, sy, cropSize, cropSize, 0, 0, 1000, 1000);

      // 4. Compress to JPEG @ 0.85 quality
      canvas.toBlob((blob) => {
        if (!blob) return;

        // 5. Generate filename: prod_YYYYMMDD_HHMMSS.jpg
        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        const timestamp = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
        const fileName = `prod_${timestamp}.jpg`;

        // Create Blob Object URL
        const objectUrl = URL.createObjectURL(blob);

        // Silent programmatic background save
        const downloadAnchor = document.createElement('a');
        downloadAnchor.href = objectUrl;
        downloadAnchor.download = fileName;
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        document.body.removeChild(downloadAnchor);

        // 6. Push to Gallery Drawer
        appendThumbnail(objectUrl, fileName);

      }, 'image/jpeg', 0.85);
    }

    // Add captured image to the bottom review drawer
    function appendThumbnail(url, title) {
      captureCount++;
      drawerCount.textContent = `Captured Session (${captureCount})`;

      const wrap = document.createElement('div');
      wrap.className = 'thumb-wrap';

      const img = document.createElement('img');
      img.src = url;
      img.alt = title;

      wrap.appendChild(img);
      galleryDrawer.prepend(wrap); // Newest items first
    }

    // Attach Shutter Click
    shutterBtn.addEventListener('click', captureProductPhoto);

    // Boot camera on load
    window.addEventListener('DOMContentLoaded', initCamera);
  })();
</script>
</body>
</html>
